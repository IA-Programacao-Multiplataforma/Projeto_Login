server:
  port: 8082

spring:
  application:
    name: gateway

  cors:
    url:
      - "http://localhost:3000"
      - "http://localhost:8081"
      - "http://localhost:8082"
      - "http://localhost:8083"
      - "*"

  cloud:
    compatibility-verifier:
      enabled: false 

    gateway:
      routes:
        - id: login-service
          uri: http://localhost:8081
          predicates:
            - Path=/fatec/login/v1/**, /login/**, /usuarios/**, /autenticacao/**, /user/**, /auth/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG